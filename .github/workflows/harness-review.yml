## Review a pull request against its ticket and the project's instructions.
## Independent lenses, a skeptic on every blocker, one comment with a verdict
## and a confidence. Advisory: it is never a required check, so it never
## blocks a merge — machines gate, agents advise. (A review that fails to
## start, or whose isolation check fails closed, does show red.)
##
## It reviews every ready pull request from this repository, people's as well
## as the harness's, and each review spends AI credits. Narrow `on:` (a label,
## a branch prefix) if that is not what the team wants.
##
## As in ship, the job that runs agents is given no GitHub token, and every
## job runs the base branch's harness: the pull request's tree is only what
## the reviewers read. Pull requests from forks are never reviewed, because
## the reviewers run with this repository's Copilot token.
name: "Harness · review"

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions: {}

env:
  PR: ${{ github.event.pull_request.number || inputs.pr }}

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: harness-review-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      skip: ${{ steps.prepare.outputs.skip }}
      ref: ${{ steps.prepare.outputs.ref }}
    steps:
      # The base, never the pull request: this job holds the GitHub token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        # Also skips a dispatched review of a pull request from a fork.
        run: node harness/bin/run.mjs review "$PR" --phase prepare
      - uses: actions/upload-artifact@v4
        with:
          name: review-handoff-prepare
          path: .harness/handoff/
          include-hidden-files: true
          retention-days: 3

  review:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # The base's harness at the root; the pull request in the workspace.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          path: .harness/worktrees/pr-${{ github.event.pull_request.number || inputs.pr }}
          fetch-depth: 0
          persist-credentials: false

      # ADAPT: the project's toolchain and JDK, if reviewers should be able to
      # build or run a single test to prove a claim. Remove if they only read.
      # No `cache:`: this job runs the branch's code, and a cache it saved
      # would be restored by other workflows. Restore-only is safe, copied
      # into /home/harness-agent/.m2/repository in "Isolate the agents".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: npm install -g "@github/copilot@${{ vars.COPILOT_CLI_VERSION || '1.0.103' }}"

      - uses: actions/download-artifact@v4
        with:
          name: review-handoff-prepare
          path: .harness/handoff/

      # Agents' code runs next, as a user of its own. As `runner` it could
      # plant files the job's later steps run (a .git/config hook, the
      # downloaded actions) and read their tokens. As `harness-agent` it owns
      # nothing they read, cannot read their environment, and cannot sudo;
      # `runner` keeps only the right to run commands as that user. The step
      # fails closed if any of that does not hold.
      # ADAPT (harness/ADAPTING.md §2): install whatever the gate needs above
      # this step; files the setup actions leave in the runner's home must be
      # copied to the agent's, as settings.xml is below; variables must be in
      # the build command's --preserve-env list. Docker stays off: access to
      # it is root by another name. If the gate needs it (Testcontainers),
      # delete the systemctl/chmod lines, add `sudo usermod -aG docker "$A"`
      # before sudoers is rewritten, and delete the Docker check — and read
      # §9 first: the boundary inside this job is then gone.
      - name: Isolate the agents
        run: |
          set -euo pipefail
          A=harness-agent
          sudo useradd --create-home --shell /bin/bash "$A"
          # The trusted checkout, root-owned and read-only to the agents; only
          # its .harness/ — the workspace and the run's outputs — is theirs.
          sudo mkdir -p /srv/harness
          sudo cp -a "$GITHUB_WORKSPACE" /srv/harness/root
          sudo chown -R root:root /srv/harness/root
          sudo chmod -R a+rX,go-w /srv/harness/root
          sudo chown -R "$A:$A" /srv/harness/root/.harness
          # Maven's settings and toolchains, as setup-java wrote them for runner.
          sudo install -d -o "$A" -g "$A" -m 700 "/home/$A/.m2"
          for f in settings.xml toolchains.xml; do
            if [ -f "$HOME/.m2/$f" ]; then sudo install -o "$A" -g "$A" -m 600 "$HOME/.m2/$f" "/home/$A/.m2/$f"; fi
          done
          sudo -u "$A" git -C "/home/$A" config --global user.name "harness[bot]"
          sudo -u "$A" git -C "/home/$A" config --global user.email "harness@users.noreply.github.com"
          sudo -u "$A" git -C "/home/$A" config --global --add safe.directory '*'
          # The runner's home — its temp files, logs and checkout — is not the
          # agents' to read.
          chmod 700 "$HOME"
          sudo systemctl stop docker.socket docker containerd >/dev/null 2>&1 || true
          sudo chmod 000 /var/run/docker.sock 2>/dev/null || true
          # Nothing scheduled may start agent code again after the kill below.
          echo "$A" | sudo tee -a /etc/cron.deny /etc/at.deny >/dev/null
          sudo systemctl stop cron atd >/dev/null 2>&1 || true
          for g in sudo admin wheel; do sudo gpasswd -d "$USER" "$g" >/dev/null 2>&1 || true; done
          # From here on: runner may act as harness-agent, and as nobody else.
          sudo sh -c "rm -f /etc/sudoers.d/*; echo '$USER ALL=($A) NOPASSWD:SETENV: ALL' > /etc/sudoers.d/harness-agent; chmod 440 /etc/sudoers.d/harness-agent"
          sudo -k
          if sudo -n true 2>/dev/null || sudo -S -k true </dev/null 2>/dev/null; then echo "::error::sudo to root is still available"; exit 1; fi
          sudo -n -u "$A" true || { echo "::error::cannot run commands as $A"; exit 1; }
          if sudo -n -u "$A" sudo -n true 2>/dev/null; then echo "::error::$A can sudo"; exit 1; fi
          if sudo -n -u "$A" docker info >/dev/null 2>&1; then echo "::error::$A can reach Docker"; exit 1; fi
          if sudo -n -u "$A" test -r "$RUNNER_TEMP" || sudo -n -u "$A" test -x "$HOME"; then echo "::error::$A can reach the runner's home"; exit 1; fi

      # As harness-agent, from the read-only copy of the trusted checkout. Then
      # every process of that user is killed at once (kill -1), before the
      # upload steps run; and again in the next step, whatever happened.
      - name: Review
        working-directory: /srv/harness/root
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          status=0
          sudo -n -u harness-agent --preserve-env=COPILOT_GITHUB_TOKEN,GITHUB_ACTIONS,PR,JAVA_HOME -- \
            env "PATH=$PATH" node harness/bin/run.mjs review "$PR" --phase build || status=$?
          sudo -n -u harness-agent kill -9 -1 2>/dev/null || true
          exit $status

      - name: Stop everything the agents started
        id: stop
        if: always()
        run: |
          sudo -n -u harness-agent kill -9 -1 2>/dev/null || true
          sleep 1
          # Collect relies on this: nothing of theirs may still be running.
          if pgrep -u harness-agent >/dev/null; then echo "::error::processes of harness-agent survived"; exit 1; fi
          echo "clean=true" >> "$GITHUB_OUTPUT"

      # The uploads run as runner. Reading the agents' folder directly, they
      # would follow a link the agents left (to /proc/self/environ, say) and
      # upload whatever it points to. So: regular files only, links never
      # followed, copied into runner's own folder once every agent process is
      # dead; the uploads read the copy.
      - name: Collect the agents' outputs
        if: always() && steps.stop.outputs.clean == 'true'
        run: |
          out="$RUNNER_TEMP/harness-out"
          rm -rf "$out"; mkdir -p "$out"
          cd /srv/harness/root/.harness 2>/dev/null || exit 0
          find -P handoff runs -type f \( -name 'review-*.build.json' -o -path 'runs/*' \) -exec cp --no-dereference --parents -t "$out/" {} + 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-handoff-build
          path: ${{ runner.temp }}/harness-out/handoff/review-*.build.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-review-runs
          path: ${{ runner.temp }}/harness-out/runs/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  publish:
    needs: [prepare, review]
    if: always() && needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # The base branch's harness posts the comment, not the PR's.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: review-handoff-prepare
          path: .harness/handoff/
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: review-handoff-build
          path: .harness/handoff/
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node harness/bin/run.mjs review "$PR" --phase publish
