## Review a pull request against its ticket and the project's instructions.
## Independent lenses, a skeptic on every blocker, one comment with a verdict
## and a confidence. Advisory: a review that cannot run is a warning, never a
## red check, so it never blocks a merge — machines gate, agents advise.
##
## It reviews every ready pull request from this repository, people's as well
## as the harness's, and each review spends AI credits. Narrow `on:` (a label,
## a branch prefix) if that is not what the team wants.
##
## As in ship, the job that runs agents is given no GitHub token, and every
## job runs the base branch's harness: the pull request's tree is only what
## the reviewers read. Pull requests from forks are never reviewed, because
## the reviewers run with this repository's Copilot token.
name: "Harness · review"

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions: {}

env:
  PR: ${{ github.event.pull_request.number || inputs.pr }}

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: harness-review-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      skip: ${{ steps.prepare.outputs.skip }}
      ref: ${{ steps.prepare.outputs.ref }}
    steps:
      # The base, never the pull request: this job holds the GitHub token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        # Also skips a dispatched review of a pull request from a fork.
        run: node harness/bin/run.mjs review "$PR" --phase prepare
      - uses: actions/upload-artifact@v4
        with:
          name: review-handoff-prepare
          path: .harness/handoff/
          include-hidden-files: true
          retention-days: 3

  review:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # The base's harness at the root; the pull request in the workspace.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.ref }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          path: .harness/worktrees/pr-${{ github.event.pull_request.number || inputs.pr }}
          fetch-depth: 0
          persist-credentials: false

      # ADAPT: the project's toolchain and JDK, if reviewers should be able to
      # build or run a single test to prove a claim. Remove if they only read.
      # No `cache:`: this job runs the branch's code, and a cache it saved
      # would be restored by other workflows. Restore-only is safe.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: npm install -g "@github/copilot@${{ vars.COPILOT_CLI_VERSION || '1.0.103' }}"

      - uses: actions/download-artifact@v4
        with:
          name: review-handoff-prepare
          path: .harness/handoff/

      # Agents' code runs next. Without sudo it cannot read the runner's own
      # memory or other users' files; the step fails closed if sudo survives.
      # ADAPT: anything the gate needs installed must be installed above.
      - name: Turn off sudo for the rest of the job
        run: |
          sudo sh -c 'rm -f /etc/sudoers.d/*'
          for g in sudo admin wheel; do sudo gpasswd -d "$USER" "$g" >/dev/null 2>&1 || true; done
          sudo -k
          if sudo -n true 2>/dev/null; then echo "::error::sudo is still available; the build job must not have it"; exit 1; fi

      - name: Review
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          status=0
          node harness/bin/run.mjs review "$PR" --phase build || status=$?
          node harness/bin/reap.mjs
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-handoff-build
          path: .harness/handoff/review-*.build.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-review-runs
          path: .harness/runs/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  publish:
    needs: [prepare, review]
    if: always() && needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # The base branch's harness posts the comment, not the PR's.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: review-handoff-prepare
          path: .harness/handoff/
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: review-handoff-build
          path: .harness/handoff/
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node harness/bin/run.mjs review "$PR" --phase publish
