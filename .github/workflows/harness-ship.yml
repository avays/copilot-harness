## Label an issue `ready-for-ai` and it becomes a verified pull request — or a
## draft handed to a person, with everything still open written down.
##
## Three jobs, and only the middle one runs agents:
##   claim   — reads the issue, claims it, picks the branch      GitHub token
##   build   — `copilot workflow run harness-ship`, headless     NO GitHub token
##   publish — pushes, opens the PR, labels, comments            GitHub token
## An agent can read the environment of every process above it, so the only
## way to keep the GitHub token from agents is to keep it out of their job.
## Every job runs the base branch's harness; the branch is only the workspace
## the agents edit. The work crosses from build to publish as a git bundle.
##
## Private Maven repository? See ADAPTING.md §4: its credential goes in the
## Build step's env, and the agents can read it.
##
## Needs: a COPILOT_GITHUB_TOKEN secret (fine-grained PAT, owned by a person,
## with the "Copilot Requests" permission and no repository access).
## ADAPTING.md §6 has the details.
name: "Harness · ship"

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
      size:
        description: "Force a size: full or small (blank: sized from the ticket)"
        required: false
        default: ""

permissions: {}

env:
  ISSUE: ${{ github.event.issue.number || inputs.issue }}

jobs:
  claim:
    # ADAPT: the label must match github.labels.ready in harness.config.mjs.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ready-for-ai'
    # One run per ticket, at the job level so only runs that pass the `if`
    # join the group: at the workflow level every label event on the issue
    # would, and a newer no-op could cancel the real run while it waits.
    concurrency:
      group: harness-ship-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      skip: ${{ steps.prepare.outputs.skip }}
      ref: ${{ steps.prepare.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claim
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.HARNESS_GH_TOKEN || github.token }}
          SIZE: ${{ inputs.size }}
        run: |
          gh auth setup-git
          node harness/bin/run.mjs ship "$ISSUE" --phase prepare ${SIZE:+--$SIZE}
      - uses: actions/upload-artifact@v4
        with:
          name: handoff-claim
          path: .harness/handoff/
          include-hidden-files: true
          retention-days: 3

  build:
    needs: claim
    if: needs.claim.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Read-only, and no step below is given a GitHub token.
    permissions:
      contents: read
    steps:
      # Two checkouts. The root is the base branch: its harness is the one
      # that runs, so agents' edits to harness/ on the branch never decide
      # the loop. The branch (or the base, for a first attempt) goes in the
      # workspace the agents edit, with every branch fetched — this job has
      # no credentials to fetch with later.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.claim.outputs.ref }}
          path: .harness/worktrees/issue-${{ github.event.issue.number || inputs.issue }}
          fetch-depth: 0
          persist-credentials: false

      # ADAPT: the project's own toolchain and JDK. The gate in
      # harness.config.mjs runs here, so this must match what the project
      # builds with. No `cache:` — this job runs code the agents wrote, and a
      # cache it saved would be restored by the project's other workflows. To
      # speed it up, restore a cache without saving (actions/cache/restore).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned: dynamic workflows are in preview and change between releases.
      - name: Install Copilot CLI
        run: npm install -g "@github/copilot@${{ vars.COPILOT_CLI_VERSION || '1.0.103' }}"

      - uses: actions/download-artifact@v4
        with:
          name: handoff-claim
          path: .harness/handoff/

      # Agents' code runs next. Without sudo or Docker (the docker group is
      # root by another name) it cannot read the runner's memory or other
      # users' files; the step fails closed if either survives.
      # ADAPT: anything the gate needs installed must be installed above. If
      # the gate needs Docker (Testcontainers), drop the Docker lines and read
      # ADAPTING.md §9 first: the boundary inside this job is then gone.
      - name: Turn off sudo and Docker for the rest of the job
        id: lock
        run: |
          sudo systemctl stop docker.socket docker containerd >/dev/null 2>&1 || true
          sudo chmod 000 /var/run/docker.sock 2>/dev/null || true
          sudo sh -c 'rm -f /etc/sudoers.d/*'
          for g in sudo admin wheel; do sudo gpasswd -d "$USER" "$g" >/dev/null 2>&1 || true; done
          sudo -k
          # -n: no cached ticket; -S with no input: no password either.
          if sudo -n true 2>/dev/null || sudo -S -k true </dev/null 2>/dev/null; then echo "::error::sudo is still available; the build job must not have it"; exit 1; fi
          if docker info >/dev/null 2>&1; then echo "::error::Docker is still reachable; the build job must not have it"; exit 1; fi
          # Before any agent runs, so they cannot change it: the reap below
          # stops every process of this user started after this moment.
          echo "since=$(node harness/bin/reap.mjs --mark)" >> "$GITHUB_OUTPUT"

      # Global: the agents commit in the workspace, a repository of its own.
      # The step ends by stopping anything the agents left running, before
      # the upload steps start with the runner's job tokens in their env.
      - name: Build
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          git config --global user.name "harness[bot]"
          git config --global user.email "harness@users.noreply.github.com"
          status=0
          node harness/bin/run.mjs ship "$ISSUE" --phase build || status=$?
          node harness/bin/reap.mjs --since "${{ steps.lock.outputs.since }}"
          # Whatever the agents wrote to this step's command files would set
          # env or PATH for the steps after it.
          : > "$GITHUB_ENV"; : > "$GITHUB_PATH"
          exit $status

      # Again, whatever happened: a cancelled or timed-out step never reached
      # its own last lines, and the uploads below still run.
      - name: Stop anything left running
        if: always() && steps.lock.outputs.since != ''
        run: node harness/bin/reap.mjs --since "${{ steps.lock.outputs.since }}"

      # Only this run's own files: the claim's are already in its artifact.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handoff-build
          path: |
            .harness/handoff/ship-*.build.json
            .harness/handoff/ship-*.bundle
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-ship-runs
          path: .harness/runs/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  publish:
    needs: [claim, build]
    # Even when build failed or timed out: publish says so on the issue,
    # so the ticket is never left claimed with nobody working on it.
    if: always() && needs.claim.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write # to start the review workflow once the pull request opens
    steps:
      # The base branch, so the code that holds the token is the reviewed
      # harness, not anything the agents wrote.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # By exact name: a pattern would take any artifact the build job made.
      - uses: actions/download-artifact@v4
        with:
          name: handoff-claim
          path: .harness/handoff/
      - uses: actions/download-artifact@v4
        # Absent when build failed or timed out; publish then reports that.
        continue-on-error: true
        with:
          name: handoff-build
          path: .harness/handoff/
      - name: Publish
        env:
          # A PAT lets the pull request start the project's other workflows
          # (CI) by itself.
          GH_TOKEN: ${{ secrets.HARNESS_GH_TOKEN || github.token }}
          HARNESS_USES_PAT: ${{ secrets.HARNESS_GH_TOKEN != '' }}
        run: |
          gh auth setup-git
          node harness/bin/run.mjs ship "$ISSUE" --phase publish
