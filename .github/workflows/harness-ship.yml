## Label an issue `ready-for-ai` and it becomes a verified pull request — or a
## draft handed to a person, with everything still open written down.
##
## Three jobs, and only the middle one runs agents:
##   claim   — reads the issue, claims it, picks the branch      GitHub token
##   build   — `copilot workflow run harness-ship`, headless     NO GitHub token
##   publish — pushes, opens the PR, labels, comments            GitHub token
## An agent can read the environment of every process above it, so the only
## way to keep the GitHub token from agents is to keep it out of their job.
## Every job runs the default branch's harness; the branch is only the
## workspace the agents edit. The work crosses from build to publish as a git bundle.
##
## Private Maven repository? See harness/ADAPTING.md §4: its credential goes in the
## Build step's env, and the agents can read it.
##
## Needs: a COPILOT_GITHUB_TOKEN secret (fine-grained PAT, owned by a person,
## with the "Copilot Requests" permission and no repository access).
## harness/ADAPTING.md §6 has the details.
name: "Harness · ship"

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
      size:
        description: "Force a size (blank: sized from the ticket)"
        type: choice
        options: [auto, full, small]
        default: auto

permissions: {}

env:
  ISSUE: ${{ github.event.issue.number || inputs.issue }}

jobs:
  claim:
    # ADAPT: the label must match github.labels.ready in harness.config.mjs.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ready-for-ai'
    # One run per ticket, at the job level so only runs that pass the `if`
    # join the group: at the workflow level every label event on the issue
    # would, and a newer no-op could cancel the real run while it waits.
    concurrency:
      group: harness-ship-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # contents: write only so the permission lookup on hand-back answers
    # works (GitHub requires push access to read a collaborator's role). This
    # job runs the default branch's code, never the branch's.
    permissions:
      contents: write
      issues: write
      pull-requests: read
    outputs:
      skip: ${{ steps.prepare.outputs.skip }}
      ref: ${{ steps.prepare.outputs.ref }}
    steps:
      # Every trusted checkout is the default branch, whatever ref started the
      # run: a dispatch from a harness branch must not run that branch's code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claim
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.HARNESS_GH_TOKEN || github.token }}
          SIZE: ${{ inputs.size }}
        run: |
          # The issue number names the workspace path too: digits only.
          case "$ISSUE" in ''|*[!0-9]*|0*) echo "::error::issue must be a plain number, got '$ISSUE'"; exit 1 ;; esac
          gh auth setup-git
          case "${SIZE:-auto}" in
            auto) node harness/bin/run.mjs ship "$ISSUE" --phase prepare ;;
            full|small) node harness/bin/run.mjs ship "$ISSUE" --phase prepare "--$SIZE" ;;
            *) echo "::error::size must be auto, full or small"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: handoff-claim
          path: .harness/handoff/
          include-hidden-files: true
          retention-days: 3

  build:
    needs: claim
    if: needs.claim.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Read by publish, to say why there is no result when there is none.
    outputs:
      isolated: ${{ steps.isolate.outcome }}
      clean: ${{ steps.stop.outputs.clean }}
    # Read-only: the job's token is used by the checkout and setup actions,
    # and no run step is given it.
    permissions:
      contents: read
    steps:
      # Two checkouts. The root is the default branch: its harness is the one
      # that runs, so agents' edits to harness/ on the branch never decide
      # the loop. The branch (or the base, for a first attempt) goes in the
      # workspace the agents edit, with every branch fetched — this job has
      # no credentials to fetch with later.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.claim.outputs.ref }}
          path: .harness/worktrees/issue-${{ github.event.issue.number || inputs.issue }}
          fetch-depth: 0
          persist-credentials: false

      # ADAPT: the project's own toolchain and JDK. The gate in
      # harness.config.mjs runs here, so this must match what the project
      # builds with. No `cache:` — this job runs code the agents wrote, and a
      # cache it saved would be restored by the project's other workflows. A
      # restore-only cache (actions/cache/restore) is safe, but must be copied
      # into /home/harness-agent/.m2/repository in "Isolate the agents".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned: dynamic workflows are in preview and change between releases.
      - name: Install Copilot CLI
        run: npm install -g "@github/copilot@${{ vars.COPILOT_CLI_VERSION || '1.0.103' }}"

      - uses: actions/download-artifact@v4
        with:
          name: handoff-claim
          path: .harness/handoff/

      # Agents' code runs next, as a user of its own. As `runner` it could
      # plant files the job's later steps run (a .git/config hook, the
      # downloaded actions) and read their tokens. As `harness-agent` it owns
      # nothing they read, cannot read their environment, and cannot sudo;
      # `runner` keeps only the right to run commands as that user. The step
      # fails closed if any of that does not hold.
      # ADAPT (harness/ADAPTING.md §2): install whatever the gate needs above
      # this step; files the setup actions leave in the runner's home must be
      # copied to the agent's, as settings.xml is below; variables must be in
      # the build command's --preserve-env list. Docker stays off: access to
      # it is root by another name. If the gate needs it (Testcontainers),
      # delete the systemctl/chmod lines, add `sudo usermod -aG docker "$A"`
      # before sudoers is rewritten, and delete the Docker check — and read
      # §9 first: the boundary inside this job is then gone.
      - name: Isolate the agents
        id: isolate
        run: |
          set -euo pipefail
          A=harness-agent
          sudo useradd --create-home --shell /bin/bash "$A"
          # The trusted checkout, root-owned and read-only to the agents; only
          # its .harness/ — the workspace and the run's outputs — is theirs.
          sudo mkdir -p /srv/harness
          sudo cp -a "$GITHUB_WORKSPACE" /srv/harness/root
          sudo chown -R root:root /srv/harness/root
          sudo chmod -R a+rX,go-w /srv/harness/root
          sudo chown -R "$A:$A" /srv/harness/root/.harness
          # Maven's settings and toolchains, as setup-java wrote them for runner.
          sudo install -d -o "$A" -g "$A" -m 700 "/home/$A/.m2"
          for f in settings.xml toolchains.xml; do
            if [ -f "$HOME/.m2/$f" ]; then sudo install -o "$A" -g "$A" -m 600 "$HOME/.m2/$f" "/home/$A/.m2/$f"; fi
          done
          sudo -u "$A" git -C "/home/$A" config --global user.name "harness[bot]"
          sudo -u "$A" git -C "/home/$A" config --global user.email "harness@users.noreply.github.com"
          sudo -u "$A" git -C "/home/$A" config --global --add safe.directory '*'
          # The runner's home — its temp files, logs and checkout — is not the
          # agents' to read.
          chmod 700 "$HOME"
          sudo systemctl stop docker.socket docker containerd >/dev/null 2>&1 || true
          sudo chmod 000 /var/run/docker.sock 2>/dev/null || true
          # Nothing scheduled may start agent code again after the kill below.
          echo "$A" | sudo tee -a /etc/cron.deny /etc/at.deny >/dev/null
          sudo systemctl stop cron atd >/dev/null 2>&1 || true
          # The image ships PATH folders world-writable (/usr/local/bin, the tool cache under /opt):
          # take group and world write off each, its contents and its parents, while sudo still works.
          IFS=: read -ra dirs <<< "$PATH"
          for d in "${dirs[@]}"; do
            [ -d "$d" ] || continue
            r=$(readlink -f -- "$d")
            sudo chmod -R go-w -- "$r"
            p=$r; while [ "$p" != / ]; do p=$(dirname -- "$p"); sudo chmod go-w -- "$p"; done
          done
          for g in sudo admin wheel; do sudo gpasswd -d "$USER" "$g" >/dev/null 2>&1 || true; done
          # From here on: runner may act as harness-agent, and as nobody else.
          sudo sh -c "rm -f /etc/sudoers.d/*; echo '$USER ALL=($A) NOPASSWD:SETENV: ALL' > /etc/sudoers.d/harness-agent; chmod 440 /etc/sudoers.d/harness-agent"
          sudo -k
          if sudo -n true 2>/dev/null || sudo -S -k true </dev/null 2>/dev/null; then echo "::error::sudo to root is still available"; exit 1; fi
          sudo -n -u "$A" true || { echo "::error::cannot run commands as $A"; exit 1; }
          if sudo -n -u "$A" sudo -n true 2>/dev/null; then echo "::error::$A can sudo"; exit 1; fi
          if sudo -n -u "$A" docker info >/dev/null 2>&1; then echo "::error::$A can reach Docker"; exit 1; fi
          if sudo -n -u "$A" test -r "$RUNNER_TEMP" || sudo -n -u "$A" test -x "$HOME"; then echo "::error::$A can reach the runner's home"; exit 1; fi
          # The runner's later steps (and the runner, finding bash) run tools from PATH: none of it may be
          # the agents' to write — a folder, a file in it, or a parent they could rename it out of.
          IFS=: read -ra dirs <<< "$PATH"
          for d in "${dirs[@]}"; do
            # A folder not there yet could be made and filled by the agents: check where it would go.
            r=$(readlink -m -- "$d"); while [ ! -e "$r" ] && [ "$r" != / ]; do r=$(dirname -- "$r"); done
            if [ -n "$(sudo -n -u "$A" find "$r" -maxdepth 1 -writable -print -quit 2>/dev/null)" ]; then echo "::error::$A can write in $r, which is on PATH"; exit 1; fi
            p=$r
            while [ "$p" != / ]; do
              p=$(dirname -- "$p")
              if sudo -n -u "$A" test -w "$p" && [ ! -k "$p" ]; then echo "::error::$A can write $p, a parent of $r on PATH"; exit 1; fi
            done
          done

      # As harness-agent, from the read-only copy of the trusted checkout. Then
      # every process of that user is killed at once (kill -1), before the
      # upload steps run; and again in the next step, whatever happened.
      - name: Build
        working-directory: /srv/harness/root
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          status=0
          /usr/bin/sudo -n -u harness-agent --preserve-env=COPILOT_GITHUB_TOKEN,GITHUB_ACTIONS,ISSUE,JAVA_HOME -- \
            env "PATH=$PATH" node harness/bin/run.mjs ship "$ISSUE" --phase build || status=$?
          /usr/bin/sudo -n -u harness-agent kill -9 -1 2>/dev/null || true
          exit $status

      - name: Stop everything the agents started
        id: stop
        if: always()
        run: |
          /usr/bin/sudo -n -u harness-agent kill -9 -1 2>/dev/null || true
          /usr/bin/sleep 1
          # Collect relies on this: nothing of theirs may still be running.
          if /usr/bin/pgrep -u harness-agent >/dev/null; then echo "::error::processes of harness-agent survived"; exit 1; fi
          echo "clean=true" >> "$GITHUB_OUTPUT"

      # The uploads run as runner. Reading the agents' folder directly, they
      # would follow a link the agents left (to /proc/self/environ, say) and
      # upload whatever it points to. So: regular files only, links never
      # followed, copied into runner's own folder once every agent process is
      # dead; the uploads read the copy.
      - name: Collect the agents' outputs
        id: collect
        if: always() && steps.stop.outputs.clean == 'true'
        # ADAPT: any other secret the build step was given (a package token)
        # goes here too, and its name in HARNESS_MASK (names separated by spaces or commas).
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          HARNESS_MASK: ""
        run: |
          out="$RUNNER_TEMP/harness-out"
          rm -rf "$out"; mkdir -p "$out"
          cd /srv/harness/root/.harness 2>/dev/null || exit 0
          /usr/bin/find -P handoff runs -type f \( -name 'ship-*.build.json' -o -name 'ship-*.bundle' -o -path 'runs/*' \) -exec /usr/bin/cp --no-dereference --parents -t "$out/" {} + 2>/dev/null || true
          # The job log masks secrets; an artifact does not.
          node "$GITHUB_WORKSPACE/harness/bin/mask.mjs" "$out"
          # The commits travel as a bundle, which masking can't reach: read them from the runner's own
          # clone of the branch (the agents never touched it) and refuse a bundle that holds a secret.
          b="$out/handoff/ship-$ISSUE.bundle"
          if [ -f "$b" ]; then
            W="$GITHUB_WORKSPACE/.harness/worktrees/issue-$ISSUE"
            git -C "$W" fetch -q "$b" "+refs/heads/*:refs/harness/scan/*"
            for v in COPILOT_GITHUB_TOKEN ${HARNESS_MASK//,/ }; do
              s="${!v:-}"; [ ${#s} -ge 4 ] || continue
              if git -C "$W" log -p --text --diff-merges=first-parent --format=%B --glob=refs/harness/scan --not --remotes=origin | grep -qF -- "$s"; then
                echo "::error::the agents' commits contain $v; nothing is uploaded"; rm -f "$b"; exit 1
              fi
            done
          fi

      # Only this run's own files: the claim's are already in its artifact.
      - uses: actions/upload-artifact@v4
        if: always() && steps.collect.outcome == 'success'
        with:
          name: handoff-build
          path: |
            ${{ runner.temp }}/harness-out/handoff/ship-*.build.json
            ${{ runner.temp }}/harness-out/handoff/ship-*.bundle
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && steps.collect.outcome == 'success'
        with:
          name: harness-ship-runs
          path: ${{ runner.temp }}/harness-out/runs/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  publish:
    needs: [claim, build]
    # Even when build failed or timed out: publish says so on the issue,
    # so the ticket is never left claimed with nobody working on it.
    if: always() && needs.claim.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write # to start the review workflow once the pull request opens
    steps:
      # The default branch, so the code that holds the token is the reviewed
      # harness, not anything the agents wrote.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # By exact name: a pattern would take any artifact the build job made.
      - uses: actions/download-artifact@v4
        with:
          name: handoff-claim
          path: .harness/handoff/
      - uses: actions/download-artifact@v4
        # Absent when build failed or timed out; publish then reports that.
        continue-on-error: true
        with:
          name: handoff-build
          path: .harness/handoff/
      - name: Publish
        env:
          # A PAT lets the pull request start the project's other workflows
          # (CI) by itself.
          GH_TOKEN: ${{ secrets.HARNESS_GH_TOKEN || github.token }}
          HARNESS_USES_PAT: ${{ secrets.HARNESS_GH_TOKEN != '' }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_ISOLATED: ${{ needs.build.outputs.isolated }}
          BUILD_CLEAN: ${{ needs.build.outputs.clean }}
        run: |
          gh auth setup-git
          node harness/bin/run.mjs ship "$ISSUE" --phase publish
