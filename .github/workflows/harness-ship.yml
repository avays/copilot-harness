## Label an issue `ready-for-ai` and it becomes a verified pull request — or a
## draft handed to a person, with everything still open written down.
##
## The job runs one command, harness/bin/run.mjs, which claims the ticket,
## runs the `harness-ship` Copilot workflow headless, then pushes and opens the
## pull request. The workflow is a script, not a prompt: its loops and round
## limits are code (harness/workflows/ship.mjs).
##
## Needs: a COPILOT_GITHUB_TOKEN secret (fine-grained PAT, owned by a person,
## with the "Copilot Requests" permission). ADAPTING.md §6 has the details.
name: "Harness · ship"

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
      size:
        description: "Force a size: full or small (blank: sized from the ticket)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write # to start the review workflow once the pull request opens

jobs:
  ship:
    # ADAPT: the label must match github.labels.ready in harness.config.mjs.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ready-for-ai'
    # One run per ticket, at the job level so only runs that pass the `if`
    # join the group. At the workflow level every label event on the issue
    # would join it, and a newer no-op could cancel the real run while it waits.
    concurrency:
      group: harness-ship-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # No token left in .git/config: the agents run git and must not be
          # able to push. run.mjs authenticates through gh instead (below).
          persist-credentials: false

      # ADAPT: the project's own toolchain and JDK. The gate in
      # harness.config.mjs runs here, so this must match what the project
      # builds with.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned: dynamic workflows are in preview and change between releases.
      - name: Install Copilot CLI
        run: npm install -g "@github/copilot@${{ vars.COPILOT_CLI_VERSION || '1.0.103' }}"

      # git's credential helper asks gh, and gh needs GH_TOKEN — which
      # run.mjs has and strips from the agents' environment.
      - name: Commit as the harness, authenticate git through gh
        env:
          GH_TOKEN: ${{ secrets.HARNESS_GH_TOKEN || github.token }}
        run: |
          gh auth setup-git
          git config user.name "harness[bot]"
          git config user.email "harness@users.noreply.github.com"

      - name: Ship
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          # A PAT lets the pull request start the project's other workflows
          # (CI) by itself, and push changes to .github/workflows/.
          GH_TOKEN: ${{ secrets.HARNESS_GH_TOKEN || github.token }}
          HARNESS_USES_PAT: ${{ secrets.HARNESS_GH_TOKEN != '' }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          SIZE: ${{ inputs.size }}
        run: node harness/bin/run.mjs ship "$ISSUE" ${SIZE:+--$SIZE}

      - name: Keep the run folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-ship-${{ github.event.issue.number || inputs.issue }}
          path: .harness/runs/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
